<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Kéz Kontroller - AR Ostrom</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- PeerJS CDN a közvetlen P2P WebRTC kapcsolathoz -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      background: #070a13;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .controller-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 1.5rem;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title-row h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .connect-box {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .code-display {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      color: #fbbf24;
      text-align: center;
      background: #030712;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px dashed rgba(251, 191, 36, 0.5);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      width: fit-content;
    }
    .status-pill.connected {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.4);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 380px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }
    .hand-hud {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.75);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #fff;
    }
    .btn-cam {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #fff;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="controller-card">
    <div class="title-row">
      <h1>💻 Laptop Kéz Kontroller</h1>
      <div id="conn-status" class="status-pill">🔴 Várakozás a telefonra...</div>
    </div>

    <div class="connect-box">
      <div style="font-size: 0.85rem; color: #94a3b8;">
        1. Írd be ezt a 4 jegyű kódot a telefonodon a "Távoli kézkövetés" mezőbe:
      </div>
      <div id="room-code" class="code-display">----</div>
      <div style="font-size: 0.8rem; color: #cbd5e1;">
        💡 A laptop nagy teljesítményű processzora számolja a kezedet 60 FPS-sel, és valós időben (WebRTC P2P) küldi a jelet a telefonodnak!
      </div>
    </div>

    <div>
      <button id="btn-start-camera" class="btn-cam">📷 Webkamera indítása</button>
    </div>

    <div class="video-wrapper">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="canvas-overlay"></canvas>
      <div id="hud-text" class="hand-hud">🖐️ Kéz állapota: Kamera leállítva</div>
    </div>
  </div>

  <script type="module" src="./src/controllerApp.js"></script>
</body>
</html>
